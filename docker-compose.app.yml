services:
  auth-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - marketplace

  auth-service:
    build:
      context: .
    environment:
      POSTGRES_CONNECTION_STRING: postgresql+asyncpg://postgres:postgres@auth-postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-change-me}
    ports:
      - "8000:8000"
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks:
      - marketplace

networks:
  marketplace:
    name: marketplace
    external: true

volumes:
  pgdata:
